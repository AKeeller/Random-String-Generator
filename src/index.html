<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f6f6f8">
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#101114">
    <meta name="description" content="A tiny password generator using all visible ASCII characters.">
    <link rel="manifest" href="./manifest.webmanifest">
    <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png">
    <link rel="icon" href="./icon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="./styles.css">
    <title>Random String</title>
  </head>
  <body>
    <main class="generator">
      <div class="length-control" data-active-index="1">
        <button type="button" data-length="16">16</button>
        <button type="button" data-length="32" data-selected="true">32</button>
        <button type="button" data-length="64">64</button>
      </div>

      <div id="result" class="result"></div>

      <div class="actions">
        <button id="copy" class="copy-button" type="button">
          <span class="copy-label">Copy</span>
          <svg class="copy-check" viewBox="0 0 24 24">
            <path d="m5 12 4.5 4.5L19 7" />
          </svg>
        </button>
        <span id="status" class="status"></span>
      </div>
    </main>
    <script src="./app.js" defer></script>
  </body>
</html>
